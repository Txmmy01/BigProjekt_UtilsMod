name: Build v3 Release

on:
  push:
    branches:
      - main
      - v3.0.0-dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build UtilsMod v3 Release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'
      - name: Build v3 release candidate
        run: gradle --no-daemon build
      - name: Upload v3 release candidate JAR
        uses: actions/upload-artifact@v7
        with:
          name: UtilsMod-v3-release-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
